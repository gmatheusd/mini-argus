spring.application.name=mini-argus
management.endpoints.web.exposure.include=health,info

# Banco de dados
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/miniargus}
spring.datasource.username=${DB_USER:miniargus}
spring.datasource.password=${DB_PASSWORD:miniargus}

# JPA
spring.jpa.hibernate.ddl-auto=validate